# Profile README: contribution snake
#
# Renders the animated "snake" that eats my GitHub contribution graph
# (https://github.com/acrossoffwest) and publishes the SVG to the `output`
# branch, from where the profile README embeds it. Purely cosmetic — shows
# contribution activity on the profile page. Runs weekly (Monday 00:00 UTC)
# and on every push to main; can be triggered manually via workflow_dispatch.
name: "Profile README: contribution snake (weekly)"

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: acrossoffwest
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
